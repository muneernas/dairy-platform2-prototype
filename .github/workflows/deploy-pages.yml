name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          # Baked into the public JS at build time so the Pages demo can call Groq.
          # Demo-only: anyone can extract VITE_* from the bundle — rotate the key after the meeting.
          VITE_LLM_API_KEY: ${{ secrets.VITE_LLM_API_KEY }}
          VITE_LLM_BASE_URL: ${{ secrets.VITE_LLM_BASE_URL }}
          VITE_LLM_MODEL: ${{ secrets.VITE_LLM_MODEL }}
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
